name: Deploy container image

# Single dispatch entry point. The target cloud is selected by the repository
# variable `DEPLOY_TARGET` (set once at project setup) — exactly one job
# below activates per run.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: GHCR image tag to deploy (use the SHA tag from build.yml for pinned deployments)
        required: false
        default: latest
        type: string

jobs:
  deploy-azure:
    if: vars.DEPLOY_TARGET == 'azure'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write  # Required for Workload Identity Federation
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure via Workload Identity Federation
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Azure Container App image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "ghcr.io/${{ github.repository }}:${{ github.event.inputs.image_tag }}"

  deploy-gcp:
    if: vars.DEPLOY_TARGET == 'gcp'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write  # Required for Workload Identity Federation
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ghcr.io/${{ github.repository }}:${{ github.event.inputs.image_tag }}
