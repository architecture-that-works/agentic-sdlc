project_name:
    type: str
    help: "Project name (hyphenated, e.g. my-new-project)"

description:
    type: str
    help: "One-line project description"
    default: "Add your description here"

project_type:
    type: str
    choices: [application, agent, ml]
    default: application
    help: "Target project type — determines starter directory structure and accepted ADRs"

_templates_suffix: ".jinja2"

# .gitignore intentionally absent from _exclude — generated projects must inherit it.
# .agents/skills/ intentionally absent from _exclude — skill files travel with every generated project
#
# Template source layout: the template source is the repository root (no _subdirectory).
# Functionality is grouped by the standard root folders (.github/, src/, tests/, docs/,
# etc.), which are copied into generated projects as-is.
#
# pyproject.toml intentionally absent from _exclude: adding it also suppresses the
# pyproject.toml.jinja2 rendering (Copier matches _exclude against rendered output
# names). Both files coexist safely — Copier renders the .jinja2 template and the
# smoke test in tests/test_copier_template.py asserts the generated pyproject.toml
# carries the correct project_name.
_exclude:
    - ".git"
    - ".venv"
    - ".claude"
    - "uv.lock"
    - "copier.yml"
    - "logs"
    - "tests/test_copier_template.py"

# project_name substituted via pyproject.toml.jinja2 — no post-task required
