project_name:
    type: str
    help: "Project name (hyphenated, e.g. my-new-project)"

description:
    type: str
    help: "One-line project description"
    default: "Add your description here"

_exclude:
    - ".git"
    - ".venv"
    - ".claude"
    - "uv.lock"
    - "copier.yml"
    - "logs"

_tasks:
    - "python -c \"import pathlib; p=pathlib.Path('pyproject.toml'); p.write_text(p.read_text().replace('my-template-repo', '{{ project_name }}'))\""
    - "uv sync"
