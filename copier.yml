project_name:
    type: str
    help: "Project name (hyphenated, e.g. my-new-project)"

description:
    type: str
    help: "One-line project description"
    default: "Add your description here"

_templates_suffix: ".jinja2"

# A root file with a .jinja2 twin is dual-use: the root file is the template's own and
# Copier skips it, rendering the twin in its place (pyproject.toml, LICENSE — a project's
# MIT licence names "<project_name> contributors"). .github/CODEOWNERS is the template's
# own and never travels; a project's is written by `task setup` from GovernancePaths in
# .github/orchestrator/lib/Config.ps1 (#393). A project gets the tests of its own code
# only: tests/app/, tests/README.md, tests/conftest.py and the one test command, which
# runs pytest alone there. Every other test folder tests the template — its
# orchestrator, workflows, checks and skills — and stays home (#408).
_exclude:
    - ".git"
    - ".venv"
    - ".claude"
    - "uv.lock"
    - "copier.yml"
    - "logs"
    - ".template"
    - "tests/checks"
    - "tests/decisions"
    - "tests/evals"
    - "tests/fakes"
    - "tests/journeys"
    - "tests/repository"
    - "tests/template"
    - ".github/CODEOWNERS"
