name: Align

# Pre-backlog alignment gate (ADR-014). When an issue is opened, run
# refine → architect → plan and grant agent:backlog only when the readiness gate
# clears (refined + architected + planned + zero open questions). Processing is a
# separate, human-triggered flow (task runner / task start) — granting
# agent:backlog here does NOT start implementation.
#
# Requires secrets: GH_TOKEN (classic PAT, project scope), CLAUDE_CODE_OAUTH_TOKEN.
#
# Trigger summary:
#   issue opened (not HITL, not already agent:backlog) → align one issue
#   workflow_dispatch (issue_number)                   → align one issue manually
#
# HITL decision children (label HITL) are skipped — they are prompts for a human,
# not work items, so the gate never tries to align them (also avoids recursion
# when refine spawns HITL children for open questions).

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to align
        required: true
        type: string

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  KANBAN_ENGINE: ${{ vars.KANBAN_ENGINE || 'claude' }}

jobs:
  align:
    name: Align issue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       !contains(github.event.issue.labels.*.name, 'HITL') &&
       !contains(github.event.issue.labels.*.name, 'agent:backlog'))
    runs-on: ${{ vars.KANBAN_RUNNER_PROFILE == 'self-hosted' && fromJSON('["self-hosted","gha-project"]') || 'ubuntu-latest' }}
    # One alignment run per issue at a time; a re-open while a run is in flight queues.
    concurrency:
      group: align-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KANBAN_ENGINE: ${{ vars.KANBAN_ENGINE || 'claude' }}
      # Default branch from the event payload — zero-cost resolution in Config.ps1
      # (no gh repo view, which is GraphQL-bound). See memory project_graphql_budget.
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      KANBAN_PROJECT_NUMBER: ${{ vars.KANBAN_PROJECT_NUMBER }}
      KANBAN_PROJECT_OWNER: ${{ vars.KANBAN_PROJECT_OWNER }}
      KANBAN_PROJECT_ID: ${{ vars.KANBAN_PROJECT_ID }}
      KANBAN_STATUS_FIELD_ID: ${{ vars.KANBAN_STATUS_FIELD_ID }}
      KANBAN_OPT_BACKLOG: ${{ vars.KANBAN_OPT_BACKLOG }}
      KANBAN_OPT_IMPLEMENTING: ${{ vars.KANBAN_OPT_IMPLEMENTING }}
      KANBAN_OPT_REVIEW: ${{ vars.KANBAN_OPT_REVIEW }}
      KANBAN_OPT_MERGED: ${{ vars.KANBAN_OPT_MERGED }}
      KANBAN_ESTIMATE_FIELD_ID: ${{ vars.KANBAN_ESTIMATE_FIELD_ID }}
      KANBAN_PRIORITY_FIELD_ID: ${{ vars.KANBAN_PRIORITY_FIELD_ID }}
      KANBAN_PRIORITY_OPT_P0: ${{ vars.KANBAN_PRIORITY_OPT_P0 }}
      KANBAN_PRIORITY_OPT_P1: ${{ vars.KANBAN_PRIORITY_OPT_P1 }}
      KANBAN_PRIORITY_OPT_P2: ${{ vars.KANBAN_PRIORITY_OPT_P2 }}
      KANBAN_PRIORITY_OPT_P3: ${{ vars.KANBAN_PRIORITY_OPT_P3 }}
      KANBAN_PRIORITY_OPT_P4: ${{ vars.KANBAN_PRIORITY_OPT_P4 }}
      # Run parameter travels as env — the only transport stable across the module
      # import and nested pwsh (ADR-013). Get-OrchestratorContext reads it.
      KANBAN_ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install tooling (hosted runner)
        if: vars.KANBAN_RUNNER_PROFILE != 'self-hosted'
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          sudo npm install -g @anthropic-ai/claude-code
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Align (refine → architect → plan → grant agent:backlog when ready)
        shell: pwsh
        run: |
          # The Kanban library (Import-Module) runs the Backlog-gate conductor.
          # Absolute path: Import-Module treats a bare relative path as a module NAME.
          Import-Module "$env:GITHUB_WORKSPACE/.github/orchestrator/Orchestrator.psd1" -Force
          $ctx = Get-OrchestratorContext
          if ($ctx.IssueNumber -le 0) {
            throw "KANBAN_ISSUE='$($ctx.IssueNumber)' did not resolve to a positive issue number — refusing to align #0."
          }
          Invoke-Alignment -IssueNumber $ctx.IssueNumber



