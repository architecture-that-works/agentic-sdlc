name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    # The job budget covers a COLD `uv sync`: a dependency bump misses the uv
    # cache and the install can take a couple of minutes on the first run. The
    # ruff gate itself must stay fast — that budget (issue #120) is enforced
    # per-step below, so a slow cold install no longer trips a false lint timeout.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      # Budget: ruff must stay well under a minute (issue #120). The step-level
      # timeout guards ruff's own runtime, independent of install/cache cost.
      - run: uv run ruff check .
        timeout-minutes: 1
      - run: uv run ruff format --check .
        timeout-minutes: 1

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pip-audit

  guards:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Module Map integrity
        shell: pwsh
        run: .github/checks/check-module-map.ps1
      - name: Check Script Paths
        shell: pwsh
        run: .github/checks/check-script-paths.ps1
      - name: Check Doc Paths
        shell: pwsh
        run: .github/checks/check-doc-paths.ps1
      - name: Check Module API boundary
        shell: pwsh
        run: .github/checks/check-module-api.ps1
      - name: Verify Claude Code settings
        shell: pwsh
        run: .github/checks/verify-settings.ps1

  # ── Evals (tests/README.md § Evals) ──────────────────────────────────────────
  # Evals call Claude, so they run only on a PR that changes a model-facing path.
  # The skip is a job-level `if:` rather than a `paths:` filter: a job skipped by
  # `if:` reports success, so `eval` can be a required check without blocking
  # unrelated PRs. Add your own eval targets to MODEL_FACING.
  eval-scope:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          MODEL_FACING: '^(\.agents/skills/|\.github/orchestrator/(stages/|lib/Grill\.ps1)|src/tools/commit\.py|tests/evals/)'
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE "$MODEL_FACING"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  eval:
    needs: eval-scope
    if: needs.eval-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The judge and the agents under test use the Claude CLI with the same
      # subscription token as the pipeline (afk.yml). Results go over OTLP instead
      # of the JSONL artifact when the endpoint variable is set (ADR-003 egress).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - run: sudo npm install -g @anthropic-ai/claude-code
      - run: uv run pytest -m eval --junitxml=logs/evals/junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-results
          path: logs/evals/
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
