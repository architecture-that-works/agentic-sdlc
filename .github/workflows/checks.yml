name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    # The job budget covers a COLD `uv sync`: a dependency bump misses the uv
    # cache and the install can take a couple of minutes on the first run. The
    # ruff gate itself must stay fast — that budget (issue #120) is enforced
    # per-step below, so a slow cold install no longer trips a false lint timeout.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      # Budget: ruff must stay well under a minute (issue #120). The step-level
      # timeout guards ruff's own runtime, independent of install/cache cost.
      - run: uv run ruff check .
        timeout-minutes: 1
      - run: uv run ruff format --check .
        timeout-minutes: 1

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pip-audit

  guards:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Module Map integrity
        shell: pwsh
        run: .github/checks/check-module-map.ps1
      - name: Check Script Paths
        shell: pwsh
        run: .github/checks/check-script-paths.ps1
      - name: Check Doc Paths
        shell: pwsh
        run: .github/checks/check-doc-paths.ps1
      - name: Check Doc Function Names
        shell: pwsh
        run: .github/checks/check-doc-functions.ps1
      - name: Check Module API boundary
        shell: pwsh
        run: .github/checks/check-module-api.ps1
      - name: Verify Claude Code settings
        shell: pwsh
        run: .github/checks/verify-settings.ps1

  # ── Evals (tests/README.md § Evals) ──────────────────────────────────────────
  # Evals call Claude, so they run only on a PR that changes a model-facing path.
  # The skip is a job-level `if:` rather than a `paths:` filter: a job skipped by
  # `if:` reports success, so `eval` can be a required check without blocking
  # unrelated PRs. Each target has its own PATHS_<TARGET> regex so a PR that
  # touches one target's inputs skips the others; shared harness paths
  # (conftest, judge, results, goldens loader) fire every target.
  eval-scope:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
      run_commit: ${{ steps.diff.outputs.run_commit }}
      run_refine: ${{ steps.diff.outputs.run_refine }}
      run_review: ${{ steps.diff.outputs.run_review }}
      run_implement: ${{ steps.diff.outputs.run_implement }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PATHS_SHARED: '^tests/evals/(conftest\.py|claude_judge\.py|eval_goldens\.py|eval_results\.py)$'
          PATHS_COMMIT: '^(src/tools/commit\.py|tests/evals/test_commit_eval\.py|tests/evals/goldens/commit\.jsonl)$'
          PATHS_REFINE: '^(\.agents/skills/refine/|\.github/orchestrator/(stages/|lib/Grill\.ps1)|tests/evals/test_refine_eval\.py|tests/evals/goldens/refine\.jsonl)'
          PATHS_REVIEW: '^(\.agents/skills/review/|tests/evals/test_review_eval\.py|tests/evals/goldens/review\.jsonl)'
          PATHS_IMPLEMENT: '^(\.agents/skills/implement/|tests/evals/test_implement_eval\.py|tests/evals/goldens/implement\.jsonl)'
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          shared=false
          commit=false
          refine=false
          review=false
          implement=false
          if echo "$changed" | grep -qE "$PATHS_SHARED"; then shared=true; fi
          if $shared || echo "$changed" | grep -qE "$PATHS_COMMIT"; then commit=true; fi
          if $shared || echo "$changed" | grep -qE "$PATHS_REFINE"; then refine=true; fi
          if $shared || echo "$changed" | grep -qE "$PATHS_REVIEW"; then review=true; fi
          if $shared || echo "$changed" | grep -qE "$PATHS_IMPLEMENT"; then implement=true; fi
          if $commit || $refine || $review || $implement; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "run_refine=$refine" >> "$GITHUB_OUTPUT"
          echo "run_review=$review" >> "$GITHUB_OUTPUT"
          echo "run_implement=$implement" >> "$GITHUB_OUTPUT"

  eval:
    needs: eval-scope
    if: needs.eval-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The judge and the agents under test use the Claude CLI with the same
      # subscription token as the pipeline (afk.yml). Results go over OTLP instead
      # of the JSONL artifact when the endpoint variable is set.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      # Cache the Claude CLI npm global install. The CLI ships weekly-ish
      # patches, so the key rolls over each ISO week so cached installs never
      # outlive their upstream.
      - id: cli-cache-key
        shell: bash
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"
      - id: cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/node_modules/@anthropic-ai/claude-code
            /usr/local/bin/claude
          key: claude-code-${{ runner.os }}-${{ steps.cli-cache-key.outputs.week }}
      - if: steps.cli-cache.outputs.cache-hit != 'true'
        run: sudo npm install -g @anthropic-ai/claude-code
      - name: Run commit eval
        if: needs.eval-scope.outputs.run_commit == 'true'
        run: uv run pytest tests/evals/test_commit_eval.py -m eval --junitxml=logs/evals/junit-commit.xml
      - name: Run refine eval
        if: needs.eval-scope.outputs.run_refine == 'true'
        run: uv run pytest tests/evals/test_refine_eval.py -m eval --junitxml=logs/evals/junit-refine.xml
      - name: Run review eval
        if: needs.eval-scope.outputs.run_review == 'true'
        run: uv run pytest tests/evals/test_review_eval.py -m eval --junitxml=logs/evals/junit-review.xml
      - name: Run implement eval
        if: needs.eval-scope.outputs.run_implement == 'true'
        run: uv run pytest tests/evals/test_implement_eval.py -m eval --junitxml=logs/evals/junit-implement.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: logs/evals/
          if-no-files-found: ignore

  hardening:
    runs-on: ubuntu-latest
    # Skip on private repos (no runner needed; check would always fail until published)
    # and on fork PRs (the fork's repo context differs; GH_TOKEN is not available).
    if: >-
      github.event.repository.private != true &&
      github.event.pull_request.head.repo.fork != true
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check repo hardening
        shell: pwsh
        run: .github/checks/check-repo-hardening.ps1

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
