name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    # The job budget covers a COLD `uv sync`: a dependency bump misses the uv
    # cache and the install can take a couple of minutes on the first run. The
    # ruff gate itself must stay fast — that budget (issue #120) is enforced
    # per-step below, so a slow cold install no longer trips a false lint timeout.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync
      # Budget: ruff must stay well under a minute (issue #120). The step-level
      # timeout guards ruff's own runtime, independent of install/cache cost.
      - run: uv run ruff check .
        timeout-minutes: 1
      - run: uv run ruff format --check .
        timeout-minutes: 1

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pip-audit

  # One rule: every .github/checks/check-*.ps1 runs here, so a new check is a new
  # file. No check is named in this workflow (tests/workflows/test_checks.py).
  checks:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run every check in .github/checks
        shell: pwsh
        run: |
          $failed = @()
          foreach ($check in Get-ChildItem .github/checks -Filter 'check-*.ps1' | Sort-Object Name) {
            Write-Host "::group::$($check.BaseName)"
            & pwsh -NoProfile -File $check.FullName
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -eq 0) { Write-Host "pass: $($check.BaseName)" }
            else { Write-Host "FAIL: $($check.BaseName) (exit $code)"; $failed += $check.BaseName }
          }
          if ($failed) { Write-Host "Failed checks: $($failed -join ', ')"; exit 1 }

  # ── Evals (tests/README.md § Evals) ──────────────────────────────────────────
  # Evals call Claude, so they run only on a PR that changes a file an eval reads.
  # The skip is a job-level `if:` rather than a `paths:` filter: a job skipped by
  # `if:` reports success, so `eval` can be a required check without blocking
  # unrelated PRs. One rule for every PATHS_<TARGET>: an eval fires when a file
  # it reads changes — the component's entry file or prompt source, its eval test
  # and its goldens. PATHS_SHARED (the harness, plus the orchestrator's model
  # configuration the evals read through stage_models) fires every target.
  eval-scope:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
      run_commit: ${{ steps.diff.outputs.run_commit }}
      run_refine: ${{ steps.diff.outputs.run_refine }}
      run_review: ${{ steps.diff.outputs.run_review }}
      run_implement: ${{ steps.diff.outputs.run_implement }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PATHS_SHARED: '^(tests/evals/(eval_goldens\.py|stage_models\.py)|\.github/orchestrator/lib/Config\.ps1)$'
          PATHS_COMMIT: '^(src/tools/commit\.py|tests/evals/test_commit_eval\.py|tests/evals/goldens/commit\.jsonl)$'
          PATHS_REFINE: '^(\.agents/skills/refine/(SKILL\.md|scripts/grill\.ps1)|\.github/orchestrator/lib/Grill\.ps1|tests/evals/test_refine_eval\.py|tests/evals/goldens/refine\.jsonl)$'
          PATHS_REVIEW: '^(\.agents/skills/review/SKILL\.md|\.agents/skills/review/answer\.schema\.json|tests/evals/test_review_eval\.py|tests/evals/goldens/review\.jsonl)$'
          PATHS_IMPLEMENT: '^(\.agents/skills/implement/SKILL\.md|tests/evals/test_implement_eval\.py|tests/evals/goldens/implement\.jsonl)$'
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          shared=false
          commit=false
          refine=false
          review=false
          implement=false
          if echo "$changed" | grep -qE "$PATHS_SHARED"; then shared=true; fi
          if $shared || echo "$changed" | grep -qE "$PATHS_COMMIT"; then commit=true; fi
          if $shared || echo "$changed" | grep -qE "$PATHS_REFINE"; then refine=true; fi
          if $shared || echo "$changed" | grep -qE "$PATHS_REVIEW"; then review=true; fi
          if $shared || echo "$changed" | grep -qE "$PATHS_IMPLEMENT"; then implement=true; fi
          if $commit || $refine || $review || $implement; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "run_refine=$refine" >> "$GITHUB_OUTPUT"
          echo "run_review=$review" >> "$GITHUB_OUTPUT"
          echo "run_implement=$implement" >> "$GITHUB_OUTPUT"

  eval:
    needs: eval-scope
    if: needs.eval-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Pin the CLI version so the cache key is stable and the install is reproducible.
      CLAUDE_CODE_VERSION: 2.1.330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync
      - id: cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/node_modules/@anthropic-ai/claude-code
            /usr/local/bin/claude
          key: claude-code-${{ runner.os }}-${{ env.CLAUDE_CODE_VERSION }}
      - if: steps.cli-cache.outputs.cache-hit != 'true'
        run: sudo npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
      - name: Run commit eval
        if: ${{ !cancelled() && needs.eval-scope.outputs.run_commit == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run pytest tests/evals/test_commit_eval.py -m eval
      - name: Run refine eval
        if: ${{ !cancelled() && needs.eval-scope.outputs.run_refine == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run pytest tests/evals/test_refine_eval.py -m eval
      - name: Run review eval
        if: ${{ !cancelled() && needs.eval-scope.outputs.run_review == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run pytest tests/evals/test_review_eval.py -m eval
      - name: Run implement eval
        if: ${{ !cancelled() && needs.eval-scope.outputs.run_implement == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run pytest tests/evals/test_implement_eval.py -m eval
