name: AFK

# AFK pipeline: Refine → Architect → Plan → Implement → Review → Ship.
# Requires secrets: GH_TOKEN (classic PAT, project scope), CLAUDE_CODE_OAUTH_TOKEN.
#
# The issue is the interface. Every trigger is an issue event — or any feature-branch
# PR closing; the dispatch inputs are for backfill and manual overrides.
#
#   issue opened by the owner or a collaborator → refine (refine → architect → plan); an
#                                                  outsider's issue is never processed (#312)
#   agent:backlog label added                   → implement → review → ship
#   owner comment on open issue                 → central router reads the live pipeline
#     (not a 🤖/· pipeline comment,               label and dispatches:
#      write-access author)                        human:decision → refine (judge the reply)
#                                                  agent:failed   → retry the failed stage
#                                                  human:approval + open PR → revision cycle
#                                                    (implement → review → ship on existing
#                                                     branch; no new PR)
#                                                  agent-held states → '· comment noted' ack
#                                                  no label → refine an un-refined issue
#   any feature/{n}-* PR closes                 → reconciles the issue regardless of who
#                                                  merged it: merged → agent:shipped +
#                                                  a comment, nothing pushed; closed unmerged →
#                                                  agent:failed, your comment retries. Skipped
#                                                  only if the issue is already terminal.
#   hourly schedule                             → reconcile: re-enter any agent-held state
#                                                  nothing is working on, and resume
#                                                  agent:paused once the Claude usage limit
#                                                  has reset (max 5 h pause). Never touches a
#                                                  state a human holds
#   workflow_dispatch stage=refine, issue 0     → refine every issue with no agent:* label
#   workflow_dispatch stage=implement / ship    → manual override for one issue (ship: your
#                                                  dispatch is the approval)
#
# Queue behaviour:
#   implement runs one at a time (concurrency group). A pending run can be replaced by
#   a newer one, so each run's drain step re-dispatches while agent:backlog issues
#   remain — nothing labelled is ever skipped, oldest first.

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number (refine 0 = every issue with no agent:* label; implement 0 = oldest agent:backlog)
        required: false
        default: '0'
        type: string
      stage:
        description: Stage to run
        required: true
        type: choice
        default: refine
        options: [refine, implement, ship]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Shared by every job: credentials, the default branch, and the board's field and
# option IDs (repository variables written by `task setup`).
env:
  CLAUDE_CODE_VERSION: 2.1.330
  GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  KANBAN_PROJECT_NUMBER: ${{ vars.KANBAN_PROJECT_NUMBER }}
  KANBAN_PROJECT_OWNER: ${{ vars.KANBAN_PROJECT_OWNER }}
  KANBAN_PROJECT_ID: ${{ vars.KANBAN_PROJECT_ID }}
  KANBAN_STATUS_FIELD_ID: ${{ vars.KANBAN_STATUS_FIELD_ID }}
  KANBAN_OPT_BACKLOG: ${{ vars.KANBAN_OPT_BACKLOG }}
  KANBAN_OPT_IMPLEMENTING: ${{ vars.KANBAN_OPT_IMPLEMENTING }}
  KANBAN_OPT_REVIEW: ${{ vars.KANBAN_OPT_REVIEW }}
  KANBAN_OPT_MERGED: ${{ vars.KANBAN_OPT_MERGED }}
  KANBAN_ESTIMATE_FIELD_ID: ${{ vars.KANBAN_ESTIMATE_FIELD_ID }}
  KANBAN_PRIORITY_FIELD_ID: ${{ vars.KANBAN_PRIORITY_FIELD_ID }}
  KANBAN_PRIORITY_OPT_P0: ${{ vars.KANBAN_PRIORITY_OPT_P0 }}
  KANBAN_PRIORITY_OPT_P1: ${{ vars.KANBAN_PRIORITY_OPT_P1 }}
  KANBAN_PRIORITY_OPT_P2: ${{ vars.KANBAN_PRIORITY_OPT_P2 }}
  KANBAN_PRIORITY_OPT_P3: ${{ vars.KANBAN_PRIORITY_OPT_P3 }}
  KANBAN_PRIORITY_OPT_P4: ${{ vars.KANBAN_PRIORITY_OPT_P4 }}
  # Pinned, not read from vars.KANBAN_ENGINE: the runners below install only the
  # Claude CLI (headless Gemini was dropped — Gemini is HITL-only). The repository
  # variable still selects the engine for local `task hitl` runs; reading it here
  # made every cloud run die at the engine check with "agy: not recognized".
  KANBAN_ENGINE: claude

jobs:

  # ── Refine (refine → architect → plan → grant agent:backlog) ─────────────────
  refine:
    name: Refine issue
    # Runs on: new issues opened by someone with write access, and manual dispatch.
    # On a public repo anyone can open an issue; this job runs with the owner's tokens,
    # so the author check here matches the comment job's (#312). All owner comments
    # are handled by the central comment router job below.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'refine') ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
       !contains(github.event.issue.labels.*.name, 'agent:backlog'))
    runs-on: ${{ vars.KANBAN_RUNNER_PROFILE == 'self-hosted' && fromJSON('["self-hosted","gha-project"]') || 'ubuntu-latest' }}
    concurrency:
      # Per issue, shared with the comment job: an owner comment that arrives while
      # refine runs queues behind it instead of refining the same issue in parallel.
      group: refine-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    env:
      KANBAN_ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: vars.KANBAN_RUNNER_PROFILE != 'self-hosted'
        with:
          enable-cache: true

      - name: Install tooling (hosted runner)
        if: vars.KANBAN_RUNNER_PROFILE != 'self-hosted'
        shell: bash
        run: |
          sudo npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Refine (refine → architect → plan → grant agent:backlog when ready)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if ([int]$env:KANBAN_ISSUE -gt 0) {
            Import-Module "$env:GITHUB_WORKSPACE/.github/orchestrator/Orchestrator.psd1" -Force
            $null = Invoke-Orchestration -From refine -IssueNumber ([int]$env:KANBAN_ISSUE)
          } else {
            # Backfill: every open issue with no agent:* label.
            pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/.github/tasks/refine.ps1" -Issue 0
            exit $LASTEXITCODE
          }

  # ── Comment (central router) — owner comment on any open issue ───────────────
  # The sole issue_comment consumer. Filters: open issue (not a PR), write-access
  # author, not a pipeline signal (🤖) or noise (·) comment. Reads the live pipeline
  # label and dispatches via OnComment in $PipelineStates:
  #   human:decision → refine (judge the reply against open questions)
  #   agent:failed   → retry the failed stage
  #   human:approval + open PR → revision cycle (implement → review → ship)
  #   agent-held states → '· comment noted' ack
  #   no label → treat as refine (un-refined issue)
  comment:
    name: Route owner comment
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      !startsWith(github.event.comment.body, '🤖') &&
      !startsWith(github.event.comment.body, '·')
    runs-on: ${{ vars.KANBAN_RUNNER_PROFILE == 'self-hosted' && fromJSON('["self-hosted","gha-project"]') || 'ubuntu-latest' }}
    concurrency:
      # The refine job's group: a comment routed to refine never runs beside the
      # refine its issue opened with. Independent issues still run in parallel.
      group: refine-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      KANBAN_ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: vars.KANBAN_RUNNER_PROFILE != 'self-hosted'
        with:
          enable-cache: true

      - name: Install tooling (hosted runner)
        if: vars.KANBAN_RUNNER_PROFILE != 'self-hosted'
        shell: bash
        run: |
          sudo npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Route comment
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          Import-Module "$env:GITHUB_WORKSPACE/.github/orchestrator/Orchestrator.psd1" -Force
          $null = Invoke-Orchestration -From comment -IssueNumber ([int]$env:KANBAN_ISSUE)

  # ── Implement (full pipeline: implement → review loop → ship) ────────────────
  implement:
    name: Implement
    # agent:backlog is the go signal: refine grants it when nothing waits on the owner.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'implement') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
       github.event.label.name == 'agent:backlog')
    runs-on: ${{ vars.KANBAN_RUNNER_PROFILE == 'self-hosted' && fromJSON('["self-hosted","gha-project"]') || 'ubuntu-latest' }}
    concurrency:
      group: implement-pipeline
      cancel-in-progress: false
    env:
      TRIGGERED_ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: vars.KANBAN_RUNNER_PROFILE != 'self-hosted'
        with:
          enable-cache: true

      - name: Install tooling (hosted runner)
        if: vars.KANBAN_RUNNER_PROFILE != 'self-hosted'
        shell: bash
        run: |
          sudo npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Resolve backlog issue
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          $issue = $env:TRIGGERED_ISSUE
          if (-not $issue -or $issue -eq '0') {
            $issue = gh issue list --repo $env:GITHUB_REPOSITORY `
              --label 'agent:backlog' --state open `
              --json number --jq 'sort_by(.number) | .[0].number // empty' 2>$null
          } else {
            $hasLabel = gh issue view $issue --repo $env:GITHUB_REPOSITORY `
              --json labels --jq '[.labels[].name] | (contains(["agent:backlog"]) or contains(["agent:implementing"]))' 2>$null
            if ($hasLabel -ne 'true') {
              Write-Output "Issue #$issue no longer has agent:backlog or agent:implementing — picking oldest remaining."
              $issue = gh issue list --repo $env:GITHUB_REPOSITORY `
                --label 'agent:backlog' --state open `
                --json number --jq 'sort_by(.number) | .[0].number // empty' 2>$null
            }
          }
          $issue = if ($issue) { $issue.Trim() } else { '' }
          if (-not $issue) {
            Write-Output "No agent:backlog issues found — nothing to do."
            "issue_number=" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Output "Resolved issue #$issue"
            "issue_number=$issue" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Run full pipeline (implement → review loop → ship)
        if: steps.resolve.outputs.issue_number != ''
        shell: pwsh
        env:
          KANBAN_ISSUE: ${{ steps.resolve.outputs.issue_number }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          Import-Module "$env:GITHUB_WORKSPACE/.github/orchestrator/Orchestrator.psd1" -Force
          $ctx = Get-OrchestratorContext
          if ($ctx.IssueNumber -le 0) {
            throw "KANBAN_ISSUE='$($ctx.IssueNumber)' did not resolve to a positive issue number — refusing to run against #0."
          }
          Invoke-Orchestration -IssueNumber $ctx.IssueNumber

      - name: Drain remaining backlog
        if: always() && steps.resolve.outputs.issue_number != ''
        shell: pwsh
        env:
          RESOLVED_ISSUE: ${{ steps.resolve.outputs.issue_number }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          $labels = gh issue view $env:RESOLVED_ISSUE --repo $env:GITHUB_REPOSITORY `
            --json labels --jq '[.labels[].name] | join(",")' 2>$null
          if (",$labels," -like '*,agent:paused,*') {
            Write-Output "Paused on the Claude usage limit — resumes on the next pipeline run or the hourly check; task reconcile resumes it now."
            exit 0
          }
          if (",$labels," -like '*,agent:backlog,*') {
            Write-Output "::error::Issue #$($env:RESOLVED_ISSUE) is still agent:backlog after the pipeline — no progress; halting drain to avoid an infinite loop."
            exit 1
          }
          $remaining = gh issue list --repo $env:GITHUB_REPOSITORY `
            --label 'agent:backlog' --state open `
            --json number --jq 'length' 2>$null
          $remaining = if ($remaining) { [int]$remaining.Trim() } else { 0 }
          if ($remaining -gt 0) {
            Write-Output "$remaining remaining agent:backlog issue(s) — dispatching next drain run."
            gh workflow run afk.yml `
              --repo $env:GITHUB_REPOSITORY `
              --ref "$env:GITHUB_REF_NAME" `
              --field stage=implement `
              --field issue_number=0
          } else {
            Write-Output "Backlog fully drained."
          }

  # ── Ship (manual) — merge one issue's PR ─────────────────────────────────────
  # The conductor ships in-process after review approves; this is the owner's manual
  # override, so dispatching it is the approval. The governance hold still applies.
  ship:
    name: Ship an issue's PR
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'ship'
    runs-on: ubuntu-latest
    concurrency:
      group: implement-pipeline
      cancel-in-progress: false
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install tooling
        shell: bash
        run: |
          sudo npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Ship
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          Import-Module "$env:GITHUB_WORKSPACE/.github/orchestrator/Orchestrator.psd1" -Force
          $issue = [int]$env:ISSUE_NUMBER
          if ($issue -le 0) { throw "stage=ship needs an issue number." }
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          $null = Invoke-Ship -IssueNumber $issue -PRNumber (Resolve-PR -IssueNumber $issue)

  # ── Feature-branch PR closed — reconcile the issue no matter who merged it ───
  pr-closed:
    name: Reconcile issue after PR close
    # Every feature-branch PR close lands here; Complete-HeldPR skips only an issue
    # Test-IssueShipped already reports as agent:shipped — see Ship.ps1 / GitHub.ps1.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest
    concurrency:
      group: pr-closed-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      # Credential-free checkout: this job only sets labels and posts comments
      # through gh — it never pushes, so git stores no credentials (#349).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # Cheap check first: skip only if Test-IssueShipped already says so — the
      # pipeline's own in-process merge path almost always wins that race (see
      # Ship.ps1), so by the time this job has cold-started, the
      # common case is already done. Calls the exact same function Complete-HeldPR
      # itself calls (#275) — no second, hand-synced copy of the rule to drift from.
      - name: Does the issue still need reconciling?
        id: reconcile
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          Import-Module "$env:GITHUB_WORKSPACE/.github/orchestrator/Orchestrator.psd1" -Force
          $issue = if ($env:PR_BRANCH -match '^feature/(\d+)-') { [int]$Matches[1] } else { 0 }
          $pending = $issue -gt 0 -and -not (Test-IssueShipped -IssueNumber $issue)
          "pending=$($pending.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Ship or fail the issue
        if: steps.reconcile.outputs.pending == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          Import-Module "$env:GITHUB_WORKSPACE/.github/orchestrator/Orchestrator.psd1" -Force
          Complete-HeldPR -PRNumber ([int]$env:PR_NUMBER) -Branch $env:PR_BRANCH -Merged ($env:PR_MERGED -eq 'true')

  # ── Reconcile (hourly) — states nothing is working on ───────────────────────
  # The warden. Every other recovery path runs inside the conductor's try/catch,
  # which a killed process never reaches: a lost runner, a cancelled job, an
  # Actions timeout or a failed drain re-dispatch leaves an issue holding a label
  # that claims work nobody is doing. This pass re-enters those, and resumes
  # anything paused on the Claude usage limit. A state a human holds —
  # human:decision, human:approval, agent:failed — is never touched (#278).
  reconcile:
    name: Reconcile stuck issues
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: reconcile
      cancel-in-progress: false
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      # The default branch, for Import-Module. No credentials stored — the pre-check
      # only reads labels; tokens are scoped to the steps that need them below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cheap check first: most hours nothing is stuck and nothing is paused, and
      # then no tooling is installed. Reports the verdict for every open issue to
      # the job summary either way, so a quiet hour is observably quiet rather
      # than indistinguishable from a job that never ran.
      - name: Is anything stuck or paused?
        id: survey
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          Import-Module "$env:GITHUB_WORKSPACE/.github/orchestrator/Orchestrator.psd1" -Force
          # Deferred rows are in-flight states a live run still owns — the next pass
          # an hour from now handles them, so they are not worth an engine install.
          $todo = @(Invoke-Reconciliation -WhatIf | Where-Object { $_.Action -ne 'deferred' })
          "pending=$(($todo.Count -gt 0).ToString().ToLower())" >> $env:GITHUB_OUTPUT

      # Re-entry needs the engine: Restart-Issue can dispatch refine, and
      # Resume-PausedIssues probes the engine before releasing a pause.
      - name: Install tooling
        if: steps.survey.outputs.pending == 'true'
        shell: bash
        run: |
          sudo npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Re-enter what nothing is working on
        if: steps.survey.outputs.pending == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          Import-Module "$env:GITHUB_WORKSPACE/.github/orchestrator/Orchestrator.psd1" -Force
          $null = Invoke-Reconciliation
