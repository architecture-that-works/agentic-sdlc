name: Orchestrator

# AFK pipeline: process aligned (agent:backlog) issues → implement → review → merge.
# Requires secrets: GH_TOKEN (classic PAT, project scope), CLAUDE_CODE_OAUTH_TOKEN.
#
# Processing is HUMAN-TRIGGERED, never automatic on labelling: alignment (align.yml)
# grants agent:backlog, then YOU start the drain via `task runner` (workflow_dispatch)
# or `task start` (local HITL). Granting agent:backlog does NOT start implementation.
#
# Trigger summary:
#   workflow_dispatch (stage=implement) → drain the agent:backlog queue (task runner)
#   workflow_dispatch (stage=merge)     → merge one approved PR
#   agent:review label                  → merge job (resilient handoff for the
#                                         review→merge step within a run)
#
# Queue behaviour:
#   The implement job uses a concurrency group so only one run executes at a time.
#   A drain step at the end of each run re-dispatches if further backlog items
#   remain, so a single `task runner` drains the whole queue, oldest first.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process (0 or empty = auto-pick oldest agent:backlog)
        required: false
        default: '0'
        type: string
      stage:
        description: Pipeline stage to run
        required: true
        type: choice
        options: [implement, merge]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  KANBAN_ENGINE: ${{ vars.KANBAN_ENGINE || 'claude' }}

jobs:

  # ── Implement (full pipeline: implement → review loop → merge) ───────────────
  implement:
    name: Implement
    # Human-triggered only (task runner / manual dispatch). Alignment grants
    # agent:backlog; it does not auto-start processing — see the header.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.stage == 'implement'
    # Runner profile controlled by KANBAN_RUNNER_PROFILE variable (set by `task setup`):
    #   hosted (default) — ubuntu-latest; uv + claude CLI installed at runtime via CLAUDE_CODE_OAUTH_TOKEN.
    #   self-hosted       — developer's machine; uv, claude, git, and auth are pre-installed.
    runs-on: ${{ vars.KANBAN_RUNNER_PROFILE == 'self-hosted' && fromJSON('["self-hosted","gha-project"]') || 'ubuntu-latest' }}
    # Serialize all pipeline runs — only one executes at a time; the next queues.
    # cancel-in-progress: false ensures a queued run waits rather than being cancelled.
    concurrency:
      group: implement-pipeline
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGY_OAUTH_TOKEN: ${{ secrets.AGY_OAUTH_TOKEN }}
      KANBAN_ENGINE: ${{ vars.KANBAN_ENGINE || 'claude' }}
      # Default branch from the event payload — lets Config.ps1 resolve it with
      # zero API cost (no `gh repo view`, which is GraphQL-bound). See memory
      # project_graphql_budget.
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      KANBAN_PROJECT_NUMBER: ${{ vars.KANBAN_PROJECT_NUMBER }}
      KANBAN_PROJECT_OWNER: ${{ vars.KANBAN_PROJECT_OWNER }}
      KANBAN_PROJECT_ID: ${{ vars.KANBAN_PROJECT_ID }}
      KANBAN_STATUS_FIELD_ID: ${{ vars.KANBAN_STATUS_FIELD_ID }}
      KANBAN_OPT_BACKLOG: ${{ vars.KANBAN_OPT_BACKLOG }}
      KANBAN_OPT_IMPLEMENTING: ${{ vars.KANBAN_OPT_IMPLEMENTING }}
      KANBAN_OPT_REVIEW: ${{ vars.KANBAN_OPT_REVIEW }}
      KANBAN_OPT_MERGED: ${{ vars.KANBAN_OPT_MERGED }}
      KANBAN_ESTIMATE_FIELD_ID: ${{ vars.KANBAN_ESTIMATE_FIELD_ID }}
      KANBAN_PRIORITY_FIELD_ID: ${{ vars.KANBAN_PRIORITY_FIELD_ID }}
      KANBAN_PRIORITY_OPT_P0: ${{ vars.KANBAN_PRIORITY_OPT_P0 }}
      KANBAN_PRIORITY_OPT_P1: ${{ vars.KANBAN_PRIORITY_OPT_P1 }}
      KANBAN_PRIORITY_OPT_P2: ${{ vars.KANBAN_PRIORITY_OPT_P2 }}
      KANBAN_PRIORITY_OPT_P3: ${{ vars.KANBAN_PRIORITY_OPT_P3 }}
      KANBAN_PRIORITY_OPT_P4: ${{ vars.KANBAN_PRIORITY_OPT_P4 }}
      TRIGGERED_ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install tooling (hosted runner)
        if: vars.KANBAN_RUNNER_PROFILE != 'self-hosted'
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          sudo npm install -g @anthropic-ai/claude-code
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve backlog issue
        id: resolve
        shell: pwsh
        run: |
          $issue = $env:TRIGGERED_ISSUE
          if (-not $issue -or $issue -eq '0') {
            $issue = gh issue list --repo $env:GITHUB_REPOSITORY `
              --label 'agent:backlog' --state open `
              --json number --jq 'sort_by(.number) | .[0].number // empty' 2>$null
          } else {
            $hasLabel = gh issue view $issue --repo $env:GITHUB_REPOSITORY `
              --json labels --jq '[.labels[].name] | contains(["agent:backlog"])' 2>$null
            if ($hasLabel -ne 'true') {
              Write-Output "Issue #$issue no longer has agent:backlog — picking oldest remaining."
              $issue = gh issue list --repo $env:GITHUB_REPOSITORY `
                --label 'agent:backlog' --state open `
                --json number --jq 'sort_by(.number) | .[0].number // empty' 2>$null
            }
          }
          $issue = if ($issue) { $issue.Trim() } else { '' }
          if (-not $issue) {
            Write-Output "No agent:backlog issues found — nothing to do."
            "issue_number=" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Output "Resolved issue #$issue"
            "issue_number=$issue" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Run full pipeline (refine → architecture → implement → review → merge)
        if: steps.resolve.outputs.issue_number != ''
        shell: pwsh
        env:
          # Run parameters travel as env — the only transport stable across the
          # module import and nested pwsh (see ADR-013). Get-KanbanContext reads
          # them; the fail-loud guard below means the pipeline can never silently
          # run against #0 (the earlier failure mode).
          KANBAN_ISSUE: ${{ steps.resolve.outputs.issue_number }}
          KANBAN_MAX_RETRIES: '3'
        run: |
          # The Kanban library (Import-Module) runs the full pipeline:
          #   refine → architecture → develop → PR → review loop → merge.
          # Absolute path: Import-Module treats a bare relative path as a module NAME.
          Import-Module "$env:GITHUB_WORKSPACE/.github/scripts/kanban/Kanban.psd1" -Force
          $ctx = Get-KanbanContext
          if ($ctx.IssueNumber -le 0) {
            throw "KANBAN_ISSUE='$($ctx.IssueNumber)' did not resolve to a positive issue number — refusing to run against #0."
          }
          Invoke-Orchestration -IssueNumber $ctx.IssueNumber

      - name: Drain remaining backlog
        if: always() && steps.resolve.outputs.issue_number != ''
        shell: pwsh
        env:
          RESOLVED_ISSUE: ${{ steps.resolve.outputs.issue_number }}
        run: |
          # Loop guard: if the issue we just resolved is STILL agent:backlog, the
          # pipeline made no progress (e.g. it errored before claiming the issue).
          # Re-dispatching would re-pick the same issue forever — halt loudly instead.
          $stillBacklog = gh issue view $env:RESOLVED_ISSUE --repo $env:GITHUB_REPOSITORY `
            --json labels --jq '[.labels[].name] | contains(["agent:backlog"])' 2>$null
          if ($stillBacklog -eq 'true') {
            Write-Output "::error::Issue #$($env:RESOLVED_ISSUE) is still agent:backlog after the pipeline — no progress; halting drain to avoid an infinite loop."
            exit 1
          }
          $remaining = gh issue list --repo $env:GITHUB_REPOSITORY `
            --label 'agent:backlog' --state open `
            --json number --jq 'length' 2>$null
          $remaining = if ($remaining) { [int]$remaining.Trim() } else { 0 }
          if ($remaining -gt 0) {
            Write-Output "$remaining remaining agent:backlog issue(s) — dispatching next drain run."
            # Re-dispatch on the SAME ref so a branch-run drains entirely on that
            # branch's code (defaults to the default branch for a normal main run).
            gh workflow run orchestrator.yml `
              --repo $env:GITHUB_REPOSITORY `
              --ref "$env:GITHUB_REF_NAME" `
              --field stage=implement `
              --field issue_number=0
          } else {
            Write-Output "Backlog fully drained."
          }

  # ── Merge (approved PR) — reuses the Kanban library's Invoke-Merge ───────────
  merge:
    name: Merge approved PR and update CONTEXT.md
    if: >-
      (github.event_name == 'issues' &&
       github.event.label.name == 'agent:review') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.stage == 'merge')
    runs-on: ubuntu-latest
    # Same concurrency group as implement: if the pipeline is still running it has
    # already merged, and the already-merged guard below makes this job a no-op.
    concurrency:
      group: implement-pipeline
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGY_OAUTH_TOKEN: ${{ secrets.AGY_OAUTH_TOKEN }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      # Invoke-Merge → Set-AgentState/Move-ToLane needs the board vars (as env).
      KANBAN_PROJECT_NUMBER: ${{ vars.KANBAN_PROJECT_NUMBER }}
      KANBAN_PROJECT_OWNER: ${{ vars.KANBAN_PROJECT_OWNER }}
      KANBAN_PROJECT_ID: ${{ vars.KANBAN_PROJECT_ID }}
      KANBAN_STATUS_FIELD_ID: ${{ vars.KANBAN_STATUS_FIELD_ID }}
      KANBAN_OPT_BACKLOG: ${{ vars.KANBAN_OPT_BACKLOG }}
      KANBAN_OPT_IMPLEMENTING: ${{ vars.KANBAN_OPT_IMPLEMENTING }}
      KANBAN_OPT_REVIEW: ${{ vars.KANBAN_OPT_REVIEW }}
      KANBAN_OPT_MERGED: ${{ vars.KANBAN_OPT_MERGED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Tooling (git identity + Claude/Gemini for the CONTEXT.md update)
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Claude is only needed for Invoke-ContextUpdate; install it only when a
          # token is present (forks without it skip the CONTEXT.md update cleanly).
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            sudo npm install -g @anthropic-ai/claude-code
          fi
          if [ -n "$AGY_OAUTH_TOKEN" ]; then
            curl -fsSL https://antigravity.google/cli/install.sh | bash
            echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$AGY_OAUTH_TOKEN" ]; then
            echo "::notice::Neither CLAUDE_CODE_OAUTH_TOKEN nor AGY_OAUTH_TOKEN set — engines not installed; post-merge CONTEXT.md update will be skipped."
          fi

      - name: Merge approved PR via the Kanban library
        shell: pwsh
        run: |
          # Label-triggered / manual merges reuse the SAME merge as the AFK pipeline
          # (Invoke-Merge): CI gate → squash-merge → agent:merged → CONTEXT.md update.
          # Single source of truth — no bash re-implementation (ADR-013).
          Import-Module "$env:GITHUB_WORKSPACE/.github/scripts/kanban/Kanban.psd1" -Force
          $issue = [int]$env:ISSUE_NUMBER
          if ($issue -le 0) { throw "ISSUE_NUMBER did not resolve to a positive issue." }

          # The agent:review label that triggered this also queues the job behind a
          # running implement pipeline (same concurrency group). If that pipeline
          # already merged, skip — Invoke-Merge would otherwise find no open PR.
          $merged = gh api "repos/$env:GITHUB_REPOSITORY/issues/$issue/labels" `
            --jq 'any(.[]; .name == "agent:merged")' 2>$null
          if ($merged -eq 'true') {
            Write-Host "Issue #$issue already merged by the pipeline — skipping."
            exit 0
          }

          # This job checks out the default branch; make the feature branch
          # available locally for Invoke-Merge's checkout + rebase.
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'

          $pr = Resolve-PR -IssueNumber $issue
          Invoke-Merge -IssueNumber $issue -PRNumber $pr




