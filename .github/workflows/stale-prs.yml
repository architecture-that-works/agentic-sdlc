name: Stale PR Nudge

# Weekly Friday-morning sweep: surface PRs that have waited at agent:reviewing
# too long (#211). Surfacing only — never merges, closes, or relabels anything;
# the human:approval merge-authority boundary is unchanged.

on:
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: write

jobs:
  stale-pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - shell: pwsh
        run: .github/tasks/stale-prs.ps1 -StaleAfterDays ${{ vars.KANBAN_STALE_PR_DAYS || 7 }} -Repo ${{ github.repository }}
