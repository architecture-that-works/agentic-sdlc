[project]
name = "my-template-repo"
version = "0.1.1"
requires-python = "==3.13.*"
dependencies = [
    "anthropic>=0.102.0",
    "pydantic-settings>=2.14.1",
]

[project.scripts]
commit-msg = "src.tools.commit:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyright>=1.1.409",
    "ruff>=0.15.13",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.0",
    "copier>=9.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
