[project]
name = "my-template-repo"
version = "0.1.1"
requires-python = "==3.13.*"
dependencies = [
    "anthropic>=0.116.0",
    "msgpack>=1.2.1",
    "pip>=26.1.2",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
commit-msg = "src.tools.commit:main"
codebase-map = "src.tools.codebase_map:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyright>=1.1.411",
    "ruff>=0.16.1",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
    "copier>=9.17.1",
    "pre-commit>=4.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
