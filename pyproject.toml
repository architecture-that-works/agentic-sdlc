[project]
name = "my-template-repo"
version = "0.1.1"
requires-python = "==3.13.*"
dependencies = [
    "anthropic>=2.6.0",
    "msgpack>=1.2.4",
    "pip>=26.3",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
commit-msg = "src.tools.commit:main"
codebase-map = "src.tools.codebase_map:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyright>=1.1.414",
    "ruff>=0.17.4",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
    "copier>=9.19.1",
    "pre-commit>=4.7.0",
    "hypothesis>=6.170.15",
    "deepeval>=4.3.3",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
]

[tool.pytest.ini_options]
# Evals call a model: opt in with `uv run pytest -m eval` (a later -m overrides this one).
# DeepEval's own pytest plugin is off — evals are plain pytest (tests/README.md).
addopts = ["-m", "not eval", "-p", "no:deepeval"]
markers = [
    "eval: LLM-judged eval of a model-facing component; calls Claude (run with -m eval)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
