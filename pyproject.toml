[project]
name = "my-template-repo"
version = "0.1.1"
requires-python = "==3.14.*"
dependencies = [
    "anthropic>=2.8.0",
    "msgpack>=1.2.4",
    "pip>=26.3",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
commit-msg = "src.tools.commit:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyright>=1.1.414",
    "ruff>=0.17.4",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
    "copier>=9.19.1",
    "pre-commit>=4.7.0",
    "hypothesis>=6.170.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Evals call a model: opt in with `uv run pytest -m eval` (a later -m overrides this one).
addopts = ["-m", "not eval"]
markers = [
    "eval: runs one stage's instructions on a stored case and checks the outcome in code; calls Claude (run with -m eval)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
