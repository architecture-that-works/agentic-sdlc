[project]
name = "my-template-repo"
version = "0.1.1"
requires-python = "==3.13.*"
dependencies = [
    "anthropic>=0.121.0",
    "msgpack>=1.2.2",
    "pip>=26.2.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
commit-msg = "src.tools.commit:main"
codebase-map = "src.tools.codebase_map:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyright>=1.1.414",
    "ruff>=0.16.8",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
    "copier>=9.18.2",
    "pre-commit>=4.6.2",
    "hypothesis>=6.163.0",
    "deepeval>=4.2.6",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
]

[tool.pytest.ini_options]
# Evals call a model: opt in with `uv run pytest -m eval` (a later -m overrides this one).
# DeepEval's own pytest plugin is off — evals are plain pytest (docs/TESTING.md).
addopts = ["-m", "not eval", "-p", "no:deepeval"]
markers = [
    "eval: LLM-judged eval of a model-facing component; calls Claude (run with -m eval)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
