[project]
name = "my-template-repo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
commit-msg = "src.tools.commit:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyright>=1.1.0",
    "ruff>=0.9.0",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.0",
    "copier>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
