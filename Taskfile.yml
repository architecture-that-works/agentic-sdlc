version: '3'

# Only setup has a target: it runs two commands (the runnable and src/tools/setup.py).
# Every other command is one runnable in .github/tasks/, run directly:
#   pwsh -NoProfile -File .github/tasks/<name>.ps1 [args]

tasks:

  setup:
    desc: "Bootstrap — run once to configure GitHub Project field IDs, labels, and environment"
    cmds:
      - pwsh -NoProfile -File .github/tasks/setup.ps1
      - uv run python src/tools/setup.py
